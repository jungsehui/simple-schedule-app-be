# GeekChat v2 — Nginx reverse proxy with TLS termination
# Replace `api.geek-chat.example` with your actual domain before deploy.
#
# Mount points (from docker-compose.yml):
#   /etc/letsencrypt        ← host certbot certs (read-only)
#   /var/www/acme           ← ACME http-01 challenge webroot (read-only)
#   /etc/nginx/conf.d/default.conf  ← this file (read-only)

# ── HTTP (80) ── ACME challenge + redirect-to-HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.geek-chat.example;

    # Let's Encrypt webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS (443) ── reverse proxy to Spring Boot app
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.geek-chat.example;

    # TLS — Let's Encrypt managed
    ssl_certificate     /etc/letsencrypt/live/api.geek-chat.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.geek-chat.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Larger upload bodies if needed
    client_max_body_size 10m;

    # ── WebSocket: must come BEFORE the catch-all `/` location ──
    location /ws {
        proxy_pass         http://app:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade        $http_upgrade;
        proxy_set_header   Connection     "upgrade";
        proxy_set_header   Host           $host;
        proxy_set_header   X-Real-IP      $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Long-lived connections
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # ── REST + everything else ──
    location / {
        proxy_pass         http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health check (allow direct access without auth)
    location = /health {
        proxy_pass         http://app:8080/health;
        access_log         off;
    }
}
