# SSA 리버스 프록시
# app(8080): 수강/강의/회원 REST + SSE 스트림 + FCM 토큰 (course+notification 단일 JVM)
# geekchat(8080, context-path=/chat): 채팅 REST + WebSocket(/chat/ws)
upstream ssa_backend {
    server app:8080;
    keepalive 32;
}

upstream geekchat_backend {
    server geekchat:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # 공통 보안 헤더
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 서버 간 내부 API는 외부 노출 금지 (course의 /internal/** 차단)
    location /internal/ {
        return 403;
    }

    # SSE 스트림: 버퍼링을 끄고 롱커넥션 유지
    location /sse-stream/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://ssa_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding on;
    }

    # FCM 토큰 API → notification 서버
    location /fcm/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://ssa_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GeekChat WebSocket: 업그레이드 헤더 + 롱커넥션 (앱 context-path=/chat이라 rewrite 불필요)
    location /chat/ws {
        proxy_pass http://geekchat_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # GeekChat REST → geekchat 서버 (/chat/auth/**, /chat/api/**, /chat/health)
    location /chat/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://geekchat_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 그 외 모든 API → SSA 단일 JVM(app)
    location / {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://ssa_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
