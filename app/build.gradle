plugins {
    // 유일한 부팅 모듈 — course/notification 라이브러리를 조합해 단일 JVM으로 실행 (ADR-0003 Stage 2)
    id 'ssa.spring-boot-app'
}

dependencies {
    // 기술 커널(spring-boot/jpa/kafka/redis api) — 부팅 모듈이 직접 의존해야 컴파일 클래스패스에 노출됨
    // (course/notification은 common을 implementation으로 가려 :app으로 전이되지 않음)
    implementation project(':common')

    // 바운디드 컨텍스트 모듈을 라이브러리로 조합
    implementation project(':course')
    implementation project(':notification')

    // 통합 컨텍스트 부팅 테스트 — EmbeddedKafka + H2, common testFixtures 재사용
    testImplementation(testFixtures(project(':common')))
    // FirebaseMessaging @MockitoBean 참조용 (런타임엔 notification 경유로 이미 포함, 컴파일만 필요)
    testImplementation libs.firebase.admin

    // 운영 스키마 기준선(Flyway V1) ↔ 엔티티 검증 — 실제 PostgreSQL 컨테이너 (ADR-0006 결정 6). Docker 필요
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    // account 백필 검증(AccountMigrationTest)이 버전 사이에 시드를 넣으려고 Flyway API를 직접 쓴다 (ADR-0006 P1)
    testImplementation 'org.flywaydb:flyway-core'
    testRuntimeOnly 'org.flywaydb:flyway-database-postgresql'
    testRuntimeOnly 'org.postgresql:postgresql'
}
