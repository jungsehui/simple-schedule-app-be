plugins {
    // 부하 테스트 스크립트 전용(비부팅) — 공통 설정은 컨벤션 플러그인 (ADR-0003 Stage 1)
    // ssa.java-library가 bootJar를 끄고 jar를 켠다 (실행 가능한 main class 없음).
    id 'ssa.java-library'
    id 'groovy'
}

description = 'ngrinder'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.apache.groovy:groovy'
    implementation 'org.ngrinder:ngrinder-core:3.5.9'
}
