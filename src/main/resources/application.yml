spring:
  application:
    name: geek-chat-server

  threads:
    virtual:
      enabled: true

  main:
    # prod: eager init so bean-wiring errors fail at startup, not on first request.
    lazy-initialization: false

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:geekchat}?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useUnicode=true
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        format_sql: false

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  tomcat:
    accept-count: 10
    max-connections: 200
    threads:
      max: 10
      min-spare: 2

app:
  jwt:
    # No default — prod MUST provide JWT_SECRET (>= 32 bytes) or the app fails to start.
    secret: ${JWT_SECRET}
    access-token-expiry: 15m
    refresh-token-expiry-days: 14
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  oauth:
    callback-url: ${OAUTH_CALLBACK_URL:http://localhost:8080/auth/callback}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
