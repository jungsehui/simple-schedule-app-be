plugins {
    // 바운디드 컨텍스트 라이브러리 — 자체 bootJar 없음, :app이 조합 (ADR-0003 Stage 2)
    id 'ssa.java-library'
}

dependencies {
    // Common 모듈 의존
    implementation project(':common')
    testImplementation(testFixtures(project(':common')))

    // Actuator
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 비밀번호 해싱 — 순수 자바 bcrypt. 도메인(Password VO)이 직접 사용하며,
    // 프레임워크가 아닌 알고리즘 라이브러리라 도메인 순수성 규칙에 위배되지 않는다. (ADR-0004)
    implementation libs.bcrypt

    // 재시도·AOP·스케줄링은 common의 api(spring-retry/starter-aop)+SchedulingRetryConfig로 상속 (Stage 2)

    // DB 마이그레이션 — prod 전용 활성, ddl-auto 폐기 경로 확보 (ADR-0003 Stage 0)
    // Boot 4는 FlywayAutoConfiguration을 별도 spring-boot-flyway 모듈로 분리 — flyway-core만으론
    // 마이그레이션이 아예 안 돈다. 스타터로 오토컨피그를 포함시킨다. (ADR-0003 Stage 3b)
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // DB 드라이버 — 로컬 dev는 MySQL, prod는 Supabase PostgreSQL (application-prod.yml)
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'

    // 네이티브 쿼리 방언 회귀 테스트: H2는 MySQL/PostgreSQL 문법 오류를 재현하지 못한다
    // (CAST(... AS BIGINT) 500 사례). 실제 엔진을 컨테이너로 띄워 검증. 버전은 Boot BOM이 관리.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
    testImplementation 'org.testcontainers:testcontainers-postgresql'

    // Configuration Processor (설정 파일 자동완성용)
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
}

// 테스트 이름별 결과를 CI 로그에 남긴다. 기본 출력에는 테스트 이름이 없어
// 컨테이너 테스트(ScheduleOverlapQuery*)가 실제로 실행됐는지 로그로 확인할 수 없었다.
tasks.named('test') {
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}
