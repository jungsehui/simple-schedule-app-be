plugins {
    // 바운디드 컨텍스트 라이브러리 — 자체 bootJar 없음, :app이 조합 (ADR-0003 Stage 2)
    id 'ssa.java-library'
}

dependencies {
    // Common 모듈 의존
    implementation project(':common')
    testImplementation(testFixtures(project(':common')))

    // Actuator
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 재시도·AOP·스케줄링은 common의 api(spring-retry/starter-aop)+SchedulingRetryConfig로 상속 (Stage 2)

    // DB 마이그레이션 — prod 전용 활성, ddl-auto 폐기 경로 확보 (ADR-0003 Stage 0)
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // DB 드라이버 — 로컬 dev는 MySQL, prod는 Supabase PostgreSQL (application-prod.yml)
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'

    // Configuration Processor (설정 파일 자동완성용)
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
}
