# FreezingArchRule 위반 스토어 — 커밋 대상 (아키텍처 부채 대장)
freeze.store.default.path=src/test/archunit-violations

# allowStoreCreation=true의 위험(규칙 서술 문자열이 한 글자라도 바뀌면 새 UUID 스토어로
# 조용히 리셋된다)과 방어(FreezeStoreIntegrityTest가 고아 엔트리를 잡는다)의 상세 설명은
# common/src/test/resources/archunit.properties와
# common/src/testFixtures/java/com/example/simplescheduleapp/support/FreezeStoreIntegrity.java
# javadoc을 참고하라. 빨간불이 나면 되돌리거나, 의도한 변경이면 옛 엔트리와 짝 UUID 파일을
# 함께 지우고 새 기준선을 리뷰하라.
freeze.store.default.allowStoreCreation=true
