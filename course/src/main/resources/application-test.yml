spring:
  flyway:
    enabled: false
    baseline-on-migrate: false
    baseline-version: 0

  datasource:
    url: jdbc:h2:mem:testdb  # 인메모리 H2 DB를 사용
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        highlight_sql: true
    hibernate:
      ddl-auto: create

  kafka:
    # Boot 4 KRaft EmbeddedKafka는 랜덤 포트로 기동 — @EmbeddedKafka가 주입하는 실제 브로커 주소 사용.
    # @EmbeddedKafka가 없는 컨텍스트(ApplicationTest 등)는 프로듀서를 지연 연결하므로 기본값으로 대체. (ADR-0003 Stage 3)
    producer:
      bootstrap-servers: "${spring.embedded.kafka.brokers:localhost:9092}"
    consumer:
      bootstrap-servers: "${spring.embedded.kafka.brokers:localhost:9092}"
      group-id: "ssa-course-server-group-test" # 테스트용 group-id는 분리하는 것이 좋음

cors:
  allowedOrigins: http://localhost:3000

token:
  secretKey: "YS1zdXBlci1kdXBlci1sb25nLWFuZC11bHRyYS1zZWN1cmUtc2VjcmV0LWtleS1mb3Itand0LW11c3QtYmUtYXQtbGVhc3QtNjQtYnl0ZXM="
  accessTokenExpirationMillis: 86400000
