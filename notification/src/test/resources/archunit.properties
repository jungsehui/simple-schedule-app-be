# FreezingArchRule 위반 스토어 — 커밋 대상 (아키텍처 부채 대장)
freeze.store.default.path=src/test/archunit-violations

# 주의: allowStoreCreation=true는 편의와 위험을 함께 준다.
#
# 편의: 새 규칙을 추가하면 첫 실행에서 스토어가 자동으로 생긴다. false로 끄면 규칙을 추가할
#       때마다 사람이 손으로 스토어를 만들어야 한다. 그래서 켜 둔다.
#
# 위험: ArchUnit은 규칙을 "서술 문자열"로 식별한다(.because 안의 문구까지 포함). 그 문자열이
#       한 글자라도 바뀌면 ArchUnit은 이를 처음 보는 규칙으로 취급해서
#         (1) 새 UUID 스토어 파일을 만들고
#         (2) 현재 위반을 전부 그 파일에 새 기준선으로 다시 동결하고
#         (3) 초록으로 통과한다.
#       옛 엔트리는 지워지지 않고 고아로 남는다. 즉 래칫이 조용히 리셋되고 CI는 아무 말도 없다.
#       (ArchUnit TextFileBasedViolationStore.ensureRuleFileName의 else 분기,
#        FreezingArchRule.evaluate의 !store.contains(delegate) 분기)
#
# 이 주석은 방지 장치가 아니라 문서다. 실제 방어는 FreezeStoreIntegrityTest가 한다.
# 그 테스트가 stored.rules의 모든 키를 코드에 선언된 규칙 서술과 대조해 고아 엔트리를 잡는다.
# 빨간불이 났다면 십중팔구 규칙 텍스트를 건드린 것이다. 되돌리거나, 의도한 변경이면 옛 엔트리와
# 짝 UUID 파일을 함께 지우고 새 기준선을 리뷰하라.
freeze.store.default.allowStoreCreation=true
