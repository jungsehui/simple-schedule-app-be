# 운영 프로파일 — 민감 값은 전부 환경변수 주입 (deploy/docker-compose.prod.yml, deploy/.env.example 참고)
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    # Supabase PostgreSQL (외부 관리형). base yml의 mysql 드라이버를 반드시 override.
    driver-class-name: org.postgresql.Driver
    hikari:
      # Supabase 커넥션 한도 공유(course+notification+geekchat) — 예산 분배
      maximum-pool-size: 5
      connection-timeout: 30000
      max-lifetime: 600000

  jpa:
    hibernate:
      # TODO: Flyway 도입 후 validate로 전환 (deploy/README.md 4번 항목)
      ddl-auto: update
    show-sql: false
    # SSE Emitter로 인한 커넥션 고갈 방지
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  sql:
    # 운영에서는 시드 데이터 주입 금지 (기본 프로파일은 always)
    init:
      mode: never

  kafka:
    producer:
      bootstrap-servers: ${SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS}
    consumer:
      bootstrap-servers: ${SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS}
      group-id: "ssa-notification-server-group"

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

token:
  secretKey: ${TOKEN_SECRETKEY}
  accessTokenExpirationMillis: ${TOKEN_ACCESSTOKENEXPIRATIONMILLIS:86400000}

# FcmConfig가 ClassPathResource를 사용 중이라 파일 경로 주입은 코드 수정 필요 (deploy/README.md 4번 항목)
fcm:
  key:
    json: ${FCM_KEY_JSON}
    url: https://www.googleapis.com/auth/firebase.messaging

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

client:
  course-server-internal-url: ${CLIENT_COURSE_SERVER_INTERNAL_URL}
  # course의 /internal API 호출 시 실어 보낼 공유 시크릿 (course와 동일 값)
  internal-api-key: ${INTERNAL_API_KEY:}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
