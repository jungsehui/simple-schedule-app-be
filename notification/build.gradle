plugins {
    // 부팅 가능한 앱 모듈 — 공통 설정은 컨벤션 플러그인 (ADR-0003 Stage 1)
    id 'ssa.spring-boot-app'
}

dependencies {
    // Common 모듈 의존
    implementation project(':common')
    testImplementation(testFixtures(project(':common')))

    // Actuator / FCM / Retry / AOP
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation libs.firebase.admin
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // DB 마이그레이션 — prod 전용 활성, ddl-auto 폐기 경로 확보 (ADR-0003 Stage 0)
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // DB 드라이버 — 로컬 dev는 MySQL, prod는 Supabase PostgreSQL (application-prod.yml)
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'

    // Configuration Processor (설정 파일 자동완성용)
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
}
