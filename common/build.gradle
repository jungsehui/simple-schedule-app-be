plugins {
    // 공통 설정(java/boot/dep-mgmt/lombok/test/archunit)은 컨벤션 플러그인으로 이동 (ADR-0003 Stage 1)
    id 'ssa.java-library'          // 라이브러리 모듈 — bootJar off, jar on
    id 'java-test-fixtures'        // test-fixtures는 common만의 기능
}

dependencies {
    // 하위 모듈로 전파되어야 하는 라이브러리 'api' 사용
    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'org.springframework.kafka:spring-kafka'
    api 'org.springframework.boot:spring-boot-starter-data-redis'
    api libs.redisson.spring.boot.starter
    api libs.logstash.logback.encoder

    // 재시도는 Framework 7 네이티브(@EnableResilientMethods/@Retryable, spring-context 내장)로 이관 —
    // 별도 spring-retry 의존 불필요 (Boot 4가 BOM에서 제거). (ADR-0003 Stage 3)
    // AspectJ 스타터는 Boot 4에서 starter-aop→starter-aspectj로 리네임 (Redisson @Aspect 락에 필요).
    api 'org.springframework.boot:spring-boot-starter-aspectj'

    // Kafka Client
    // 버전은 Spring Boot BOM이 관리한다. 카탈로그의 고정 버전(3.7.1)은 BOM에 덮여 실제로는 쓰이지 않았다.
    implementation 'org.apache.kafka:kafka-clients'

    // JWT (내부 구현 상세는 implementation)
    implementation libs.jjwt.api
    runtimeOnly libs.jjwt.impl
    runtimeOnly libs.jjwt.jackson

    // 하위 모듈의 테스트에서도 사용 — testFixturesApi (@SpringBootTest / @EmbeddedKafka / @WebMvcTest)
    testFixturesApi 'org.springframework.boot:spring-boot-starter-test'
    // Boot 4에서 @WebMvcTest 슬라이스가 별도 스타터로 분리됨 (ADR-0003 Stage 3)
    testFixturesApi 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testFixturesApi 'org.springframework.kafka:spring-kafka-test'
    testFixturesApi libs.fixture.monkey.starter
    testFixturesApi libs.fixture.monkey.jakarta.validation

    // Lombok (Test Fixtures 컴파일 시 필요)
    testFixturesCompileOnly 'org.projectlombok:lombok'
    testFixturesAnnotationProcessor 'org.projectlombok:lombok'

    // Fixture Monkey (내부 테스트용)
    testFixturesImplementation libs.fixture.monkey
    testFixturesImplementation libs.fixture.monkey.api
    testFixturesImplementation libs.fixture.monkey.jakarta.validation
}
