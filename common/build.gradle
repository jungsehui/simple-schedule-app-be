plugins {
	// java-library, boot 등은 루트에서 적용했으므로 생략 가능
	// test-fixtures는 common만의 기능이므로 명시
	id 'java-test-fixtures'
}

group = "com.example"
version = "0.0.1-SNAPSHOT"

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

dependencies {
	// ===== Main 의존성 (api / implementation) =====
	// 하위 모듈로 전파되어야 하는 라이브러리는 'api' 사용
	api 'org.springframework.boot:spring-boot-starter-web'
	api 'org.springframework.boot:spring-boot-starter-data-jpa'
	api 'org.springframework.boot:spring-boot-starter-validation'
	api 'org.springframework.kafka:spring-kafka'

	// Kafka Client
	implementation 'org.apache.kafka:kafka-clients:3.7.1'

	// JWT (내부 구현 상세는 implementation 권장, 단 DTO 등에서 쓴다면 api)
	implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

	// ===== Test Fixtures 의존성 (testFixturesApi) =====
	// 하위 모듈의 테스트 코드에서도 사용할 수 있도록 'testFixturesApi'로 선언

	// Spring Boot Test (@SpringBootTest)
	testFixturesApi 'org.springframework.boot:spring-boot-starter-test'

	// Mockito (@Mock, MockitoExtension)
	// spring-boot-starter-test에 포함, 별도 버전이 필요하면 추가
	// testFixturesApi 'org.mockito:mockito-core'
	// testFixturesApi 'org.mockito:mockito-junit-jupiter'

	// Kafka Test (@EmbeddedKafka)
	testFixturesApi 'org.springframework.kafka:spring-kafka-test'

	// JUnit 5 (Assertions, Executable, ExtendWith)
	// spring-boot-starter-test에 포함되어 있지만, 명시적으로 필요할 경우 추가
	testFixturesApi 'org.junit.jupiter:junit-jupiter-api'
	testFixturesApi 'org.junit.jupiter:junit-jupiter-params'

	// Fixture Monkey
	testFixturesApi 'com.navercorp.fixturemonkey:fixture-monkey-starter:1.1.11'
	testFixturesApi 'com.navercorp.fixturemonkey:fixture-monkey-jakarta-validation:1.1.11'

	// Lombok (Test Fixtures 컴파일 시 필요)
	testFixturesCompileOnly 'org.projectlombok:lombok'
	testFixturesAnnotationProcessor 'org.projectlombok:lombok'

	// Fixture Monkey (내부 테스트용)
	testFixturesImplementation 'com.navercorp.fixturemonkey:fixture-monkey:1.1.11'
	testFixturesImplementation 'com.navercorp.fixturemonkey:fixture-monkey-api:1.1.11'
	testFixturesImplementation 'com.navercorp.fixturemonkey:fixture-monkey-jakarta-validation:1.1.11'
	// =====
}

// 라이브러리 역할을 하는 모듈이므로 bootJar(실행파일 생성)는 끄고 jar(라이브러리 생성)는 켬
tasks.named('bootJar') {
	enabled = false
}

tasks.named('jar') {
	enabled = true
}
