// 라이브러리 역할을 하는 모듈이므로 bootJar(실행파일 생성)는 끄고 jar(라이브러리 생성)는 켬
tasks.named('bootJar') {
	enabled = false
}

tasks.named('jar') {
	enabled = true
}
