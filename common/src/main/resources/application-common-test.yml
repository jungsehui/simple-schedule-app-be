spring:
  kafka:
    producer:
      bootstrap-servers: "localhost:49092"
    consumer:
      bootstrap-servers: "localhost:49092"

  # RedissonConfig가 컨텍스트 기동 시 요구 (CI에서는 redis 서비스 컨테이너로 제공)
