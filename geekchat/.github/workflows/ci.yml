name: CI

on:
  push:
    branches: ["main", "migration/**"]
  pull_request:
    branches: ["main"]

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        # Tests use the H2-backed `test` profile (application-test.yml) — no MySQL service needed.
        run: ./gradlew test --no-daemon --console=plain

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          # Multi-module: test reports live under each subproject (currently app/).
          path: "**/build/reports/tests/test"
          retention-days: 7
