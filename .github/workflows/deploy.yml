# CD: GHCR에 이미지 빌드/푸시 후, WireGuard VPN을 통해 배포 서버에 SSH 배포
#
# 필요한 GitHub Secrets (Settings > Secrets and variables > Actions):
#   WG_PRIVATE_KEY        : 배포용 WireGuard 피어의 개인키 (반드시 새로 발급받은 키 사용)
#   WG_ADDRESS            : 배포용 피어 주소 (예: 10.36.187.13/24 — 개인 노트북 피어와 다른 IP)
#   WG_PEER_PUBLIC_KEY    : 서버측 WireGuard 공개키
#   WG_PRESHARED_KEY      : PresharedKey (새로 발급 권장)
#   WG_ENDPOINT           : VPN 엔드포인트 (예: dokalab.iptime.org:40773)
#   WG_ALLOWED_IPS        : 서버 서브넷만 허용 (예: 10.64.212.0/24,10.36.187.0/24)
#                           ⚠ 0.0.0.0/0 금지 — 러너의 GitHub 연결까지 VPN으로 빨려들어가 배포가 끊김
#   DEPLOY_SSH_KEY        : 배포 전용 SSH 개인키 (ed25519 새로 발급, 서버 authorized_keys에 공개키 등록)
#   DEPLOY_SSH_KNOWN_HOSTS: ssh-keyscan 결과 (서버 호스트키 고정 — MITM 방지)
#   DEPLOY_HOST           : 배포 서버 IP (예: 10.64.212.20)
#   DEPLOY_USER           : 배포 계정 (sudo 없이 docker 그룹 권한만 가진 전용 계정 권장)
name: Deploy

on:
  # main 병합 시 자동 배포 (문서만 바뀐 커밋은 스킵)
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.planning/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 배포 환경
        type: choice
        options: [ prod, stage ]
        default: prod

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        include:
          # SSA 단일 JVM(:app = course+notification 통합): 러너에서 bootJar 빌드 후 도커라이즈
          - module: app
            context: .
            dockerfile: app/Dockerfile
            gradle_task: ':app:bootJar'
          # GeekChat: 멀티스테이지 Dockerfile이 컨테이너 안에서 자체 Gradle 빌드 수행
          - module: geekchat
            context: geekchat
            dockerfile: geekchat/Dockerfile
            gradle_task: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        if: matrix.gradle_task != ''
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        if: matrix.gradle_task != ''
        uses: gradle/actions/setup-gradle@v4

      - name: Build bootJar
        if: matrix.gradle_task != ''
        run: |
          chmod +x gradlew
          ./gradlew ${{ matrix.gradle_task }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/ssa-${{ matrix.module }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/ssa-${{ matrix.module }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # push(main) 이벤트에는 inputs가 없으므로 prod로 fallback
    environment: ${{ inputs.environment || 'prod' }}
    timeout-minutes: 15
    steps:
      - name: Checkout (deploy 번들용)
        uses: actions/checkout@v7

      - name: Set up WireGuard tunnel
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools
          sudo install -m 600 /dev/null /etc/wireguard/wg0.conf
          sudo tee /etc/wireguard/wg0.conf > /dev/null <<'WGEOF'
          [Interface]
          PrivateKey = __WG_PRIVATE_KEY__
          Address = __WG_ADDRESS__

          [Peer]
          PublicKey = __WG_PEER_PUBLIC_KEY__
          PresharedKey = __WG_PRESHARED_KEY__
          AllowedIPs = __WG_ALLOWED_IPS__
          Endpoint = __WG_ENDPOINT__
          PersistentKeepalive = 25
          WGEOF
          sudo sed -i \
            -e "s|__WG_PRIVATE_KEY__|${{ secrets.WG_PRIVATE_KEY }}|" \
            -e "s|__WG_ADDRESS__|${{ secrets.WG_ADDRESS }}|" \
            -e "s|__WG_PEER_PUBLIC_KEY__|${{ secrets.WG_PEER_PUBLIC_KEY }}|" \
            -e "s|__WG_PRESHARED_KEY__|${{ secrets.WG_PRESHARED_KEY }}|" \
            -e "s|__WG_ALLOWED_IPS__|${{ secrets.WG_ALLOWED_IPS }}|" \
            -e "s|__WG_ENDPOINT__|${{ secrets.WG_ENDPOINT }}|" \
            /etc/wireguard/wg0.conf
          sudo wg-quick up wg0

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          # 죽은 터널에서 잡 타임아웃(15분)까지 행하지 않도록 전 SSH 호출에 빠른 실패 옵션 적용
          cat >> ~/.ssh/config <<'EOF'
          Host deploy-target
            ConnectTimeout 15
            ServerAliveInterval 10
            ServerAliveCountMax 3
          EOF
          sed -i "s/Host deploy-target/Host ${{ secrets.DEPLOY_HOST }}/" ~/.ssh/config

      - name: Verify tunnel connectivity (fail fast)
        run: |
          # WG 핸드셰이크는 wg-quick up 성공만으로 보장되지 않음 (동일 피어 키를 다른 기기가
          # 점유 중이면 패킷이 그쪽으로 감). 90초 내 SSH 왕복 실패 시 명확한 메시지로 즉시 실패.
          for i in 1 2 3; do
            if ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
                 ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'echo tunnel-ok'; then
              exit 0
            fi
            echo "attempt $i failed; retrying in 15s..."; sleep 15
          done
          echo "::error::WireGuard 터널로 서버 SSH 불가 — 동일 피어 키를 쓰는 다른 기기(개인 노트북)의 터널이 Active인지 확인 후 re-run 하세요."
          exit 1

      - name: Sync deploy bundle
        run: |
          scp -i ~/.ssh/deploy_key -r deploy/docker-compose.prod.yml deploy/nginx \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/ssa/

      - name: Deploy containers
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin && \
             cd /opt/ssa && \
             IMAGE_TAG=${{ github.sha }} docker compose -f docker-compose.prod.yml --env-file .env pull && \
             IMAGE_TAG=${{ github.sha }} docker compose -f docker-compose.prod.yml --env-file .env up -d --remove-orphans && \
             docker logout ghcr.io && \
             docker image prune -f"

      # nginx는 위 up -d로 갱신되지 않는다. 이미지·환경이 그대로면 compose가 컨테이너를
      # 재생성하지 않고, 설정은 볼륨 마운트라 파일만 바뀐 채 프로세스는 옛 설정을 들고 있다.
      # 게다가 upstream 호스트명은 기동 시 1회만 해석되므로, 앱 컨테이너가 새 IP로 뜨면
      # nginx는 사라진 옛 IP로 계속 연결을 시도한다.
      # 2026-08-02 릴리스에서 이 두 가지가 각각 전면 502와 SSE 301을 일으켰다.
      # restart는 DNS 재해석까지 하므로 reload가 아니라 restart여야 한다.
      - name: Restart nginx (설정 재적용 + upstream DNS 재해석)
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd /opt/ssa && \
             docker compose -f docker-compose.prod.yml --env-file .env exec -T nginx nginx -t && \
             docker restart ssa-nginx"

      # 배포가 실제로 살아났는지 확인한다. 위 단계까지 성공해도 nginx가 백엔드에 닿지
      # 못하면 전면 502이므로, 여기서 잡지 않으면 초록 배포로 장애가 나간다.
      # URL을 반드시 따옴표로 감쌀 것 — 서버 로그인 셸이 zsh이고, zsh는 따옴표 없는 `?`를
      # 글로브 패턴으로 해석해 "no matches found"로 명령 자체를 실행하지 않는다(bash와 다름).
      # 2026-08-13 배포에서 이것 때문에 curl이 아예 돌지 않아 000이 나왔고, 운영은 멀쩡한데
      # 스모크만 거짓 실패했다.
      - name: Smoke test (배포 성공 판정)
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            'for i in 1 2 3 4 5 6; do
               code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost/lectures/search?keyword=smoke" || echo 000)
               # 401 = 인증 게이트까지 도달(정상). 5xx/000 = nginx가 백엔드에 못 닿음
               if [ "$code" = "401" ]; then echo "smoke OK (401 — 게이트 도달)"; exit 0; fi
               echo "attempt $i: HTTP $code — 10s 후 재시도"; sleep 10
             done
             echo "::error::스모크 실패 — nginx→app 경로 확인 필요 (마지막 코드 $code)"
             exit 1'

      - name: Teardown WireGuard
        if: always()
        run: sudo wg-quick down wg0 || true
