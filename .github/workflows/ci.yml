# CI: 모든 PR과 main/develop 푸시에서 빌드 + 테스트 검증
# - Kafka는 @EmbeddedKafka(in-JVM)로 제공, DB는 H2, FCM은 @Profile("!test")로 제외
# - Redisson/Redis는 컨텍스트 기동에 필요하므로 redis 서비스 컨테이너로 제공
# - playground / ngrinder 모듈은 부하 테스트 전용이므로 CI 대상에서 제외
name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_REDIS_HOST: localhost
      TEST_REDIS_PORT: 6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle (build cache 포함)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 순차 실행: course와 notification이 동시에 돌면 둘 다 EmbeddedKafka 고정 포트(49092)를
      # 잡아 충돌하므로 --parallel을 쓰지 않는다. @Tag("slow")(성능/데드락 타이밍 테스트)는 제외됨.
      - name: Build & Test
        run: ./gradlew :common:build :course:build :notification:build

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/test/'
          retention-days: 7
