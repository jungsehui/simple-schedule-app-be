# CI: 모든 PR과 main/develop 푸시에서 통합 빌드+테스트 (ADR-0003 Stage 1 — 단일 파이프라인)
# - ./gradlew buildAll 하나로 SSA(common/course/notification) + GeekChat(:app)을 컴포지트로 빌드
# - Kafka는 @EmbeddedKafka(in-JVM), SSA DB는 H2, GeekChat DB는 H2(PostgreSQL 모드), FCM은 @Profile("!test") 제외
# - Redisson/Redis는 SSA 컨텍스트 기동에 필요하므로 redis 서비스 컨테이너로 제공 (GeekChat은 Redis 미사용)
# - playground / ngrinder 모듈은 부하 테스트 전용이므로 buildAll·CI 대상에서 제외
name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_REDIS_HOST: localhost
      TEST_REDIS_PORT: 6379
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle (build cache 포함)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 단일 명령 통합 빌드. SSA 모듈은 순차 실행(--parallel 미사용)이라 EmbeddedKafka 포트 충돌 없음.
      # @Tag("slow")(성능/데드락 타이밍 테스트)는 컨벤션 플러그인에서 기본 제외됨.
      - name: Build & Test (buildAll)
        run: ./gradlew buildAll

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/test/
            geekchat/**/build/reports/tests/test/
          retention-days: 7
