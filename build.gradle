plugins {
	// Root에서는 버전을 관리하되, 직접 적용하지 않도록 'apply false' 사용
	id 'java'
	id 'org.springframework.boot' version "3.4.3" apply false
	id 'io.spring.dependency-management' version "1.1.7" apply false
}

// 모든 프로젝트(서브 모듈 포함)에 공통 적용
subprojects {
	apply plugin: 'java'
	apply plugin: 'java-library'
	apply plugin: 'org.springframework.boot'
	apply plugin: 'io.spring.dependency-management'

	group = "com.example"
	version = "0.0.1-SNAPSHOT"

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
		}
	}

	repositories {
		mavenCentral()
	}

	configurations {
		compileOnly {
			extendsFrom annotationProcessor
		}
	}

	// 여기서 Lombok 한 번에 정의
	// 모든 서브 모듈은 자동으로 Lombok 의존성
	dependencies {
		// 공통 롬복
		compileOnly 'org.projectlombok:lombok'
		annotationProcessor 'org.projectlombok:lombok'

		// 테스트 환경에서도 롬복 사용
		testCompileOnly 'org.projectlombok:lombok'
		testAnnotationProcessor 'org.projectlombok:lombok'

		// 테스트 프레임워크 공통 적용
		testImplementation 'org.springframework.boot:spring-boot-starter-test'
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	}

	// 테스트 태스크 공통 설정
	// @Tag("slow") (성능/데드락 타이밍 테스트)는 기본 test/CI에서 제외.
	// 실행하려면: ./gradlew test -PincludeSlow  또는  ./gradlew :notification:test --tests '*Performance*'
	tasks.named('test') {
		useJUnitPlatform {
			if (!project.hasProperty('includeSlow')) {
				excludeTags 'slow'
			}
		}
	}
}

